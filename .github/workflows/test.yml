name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q
      - name: Validate examples against the schemas
        run: python scripts/validate.py
      - name: Scanner smoke test
        run: |
          skillbom scan -q --no-home --root plugins -o bom.json --html report.html
          python scripts/validate.py bom.json
          python -c "import json; b = json.load(open('bom.json')); c = b['components'][0]; assert c['license'] == {**c['license'], 'status': 'declared', 'expression': 'Apache-2.0'}, c['license']; print('plugin declares', c['license']['expression'])"
