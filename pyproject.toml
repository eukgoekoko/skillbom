[project]
name = "skillbom"
version = "0.1.1"
description = "Scan installed agent skills and plugins and report their licenses as a Skill BOM"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.18"]

[project.scripts]
skillbom = "skillbom.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["plugins/skillbom/src"]

[tool.setuptools.package-data]
skillbom = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
